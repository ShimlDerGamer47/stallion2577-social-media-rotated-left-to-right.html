<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stallion2577 - Social Media Rotated</title>
    <link
      rel="icon"
      type="icon/png"
      href="Image Ordner/Website Icon Ordner/stallion2577-icon.png"
    />
    <link rel="stylesheet" href="stallion2577-social-media-rotated.css" />
    <script defer src="stallion2577-social-media-rotated.js"></script>
  </head>
  <body>
    <div id="mainContainerId" class="main-container">
      <div id="subContainerId" class="sub-container">
        <div id="instagramMainContainerId" class="instagram-main-container">
          <div id="instagramImgContainerId" class="instagram-img-container">
            <div
              id="instagramBackgroundContainerId"
              class="instagram-background-container"
            >
              <img
                width="5001"
                height="5001"
                id="instagramImgId"
                src="Image Ordner/Social Icon's Ordner/instagram_icon.png"
                alt="Instagram Account: pietrobento"
                class="instagram-img"
                loading="eager"
              />
            </div>
          </div>
          <div id="instagramNameContainerId" class="instagram-name-container">
            <span id="instagramNameSpanId" class="instagram-name-span">
              pietrobento
            </span>
          </div>
        </div>
        <div id="youtubeMainContainerId" class="youtube-main-container">
          <div id="youtubeImgContainerId" class="youtube-img-container">
            <div
              id="youtubeBackgroundContainerId"
              class="youtube-background-container"
            >
              <img
                width="500"
                height="500"
                id="youtubeImgId"
                src="Image Ordner/Social Icon's Ordner/youtube_icon.png"
                alt="YouTube Channel: Pietro Bento"
                class="youtube-img"
                loading="eager"
              />
            </div>
          </div>
          <div id="youtubeNameContainerId" class="youtube-name-container">
            <span id="youtubeNameSpanId" class="youtube-name-span">
              Pietro Bento
            </span>
          </div>
        </div>
        <div id="discordMainContainerId" class="discord-main-container">
          <div id="discordImgContainerId" class="discord-img-container">
            <div
              id="discordBackgroundContainerId"
              class="discord-background-container"
            >
              <img
                width="512"
                height="512"
                id="discordImgId"
                src="Image Ordner/Social Icon's Ordner/discord_icon.png"
                alt="Discord Server: The Sickandangry Home!"
                class="discord-img"
                loading="eager"
              />
            </div>
          </div>
          <div id="discordNameContainerId" class="discord-name-container">
            <span id="discordNameSpanId" class="discord-name-span">
              The Sickandangry Home!
            </span>
          </div>
        </div>
        <div id="facebookMainContainerId" class="facebook-main-container">
          <div id="facebookImgContainerId" class="facebook-img-container">
            <div
              id="facebookBackgroundContainerId"
              class="facebook-background-container"
            >
              <img
                width="960"
                height="960"
                id="facebookImgId"
                src="Image Ordner/Social Icon's Ordner/facebook_icon.png"
                alt="Facebook Channel: Pietro Bento"
                class="facebook-img"
                loading="eager"
              />
            </div>
          </div>
          <div id="facebookNameContainerId" class="facebook-name-container">
            <span id="facebookNameSpanId" class="facebook-name-span">
              Pietro Bento
            </span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
